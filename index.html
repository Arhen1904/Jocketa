<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <title>Portada de película</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="slides" aria-label="Historia visual de Jocketa">
      <section class="slide poster" aria-label="Primer slide">
        <img class="slide__layer layer-0" src="assets/Primer%20Slide/Capa%200.png" alt="">
        <img class="slide__layer layer-1" src="assets/Primer%20Slide/Capa%201.png" alt="">
        <img class="slide__layer layer-2" src="assets/Primer%20Slide/Capa%202.png" alt="">
      </section>

      <section class="slide poster" aria-label="Segundo slide">
        <img class="slide__layer layer-0" src="assets/Segundo%20Slide/Capa%200.png" alt="">
        <img class="slide__layer layer-1" src="assets/Segundo%20Slide/Capa%201.png" alt="">
        <img class="slide__layer layer-2" src="assets/Segundo%20Slide/Capa%202.png" alt="">
        <img class="slide__layer layer-3" src="assets/Segundo%20Slide/Capa%203.png" alt="">
        <img class="slide__layer layer-4" src="assets/Segundo%20Slide/Capa%204.png" alt="">
        <img class="slide__layer layer-5" src="assets/Segundo%20Slide/Capa%205.png" alt="">
      </section>

      <section class="slide poster" aria-label="Tercer slide">
        <img class="slide__layer layer-0" src="assets/Tercer%20Slide/Capa%200.png" alt="">
        <img class="slide__layer layer-1" src="assets/Tercer%20Slide/Capa%201.png" alt="">
        <img class="slide__layer layer-2" src="assets/Tercer%20Slide/Capa%202.png" alt="">
        <img class="slide__layer layer-3" src="assets/Tercer%20Slide/Capa%203.png" alt="">
      </section>

      <section class="slide poster" aria-label="Cuarto slide">
        <img class="slide__layer layer-0" src="assets/Cuarto%20Slide/FONDO.png" alt="">
        <img class="slide__layer layer-1" src="assets/Cuarto%20Slide/TEXTO.png" alt="">
        <a
          class="slide__button"
          href="https://vimeo.com/1148334656/88155d0382"
          target="_blank"
          rel="noopener noreferrer"
        >¡Correee!</a>
      </section>
    </main>
  </body>
</html>
