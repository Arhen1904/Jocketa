<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>Jocketa</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="slides" aria-label="Historia visual de Jocketa">
      <section class="slide slide--desktop poster" aria-label="Primer slide">
        <img
          class="slide__layer layer-0"
          src="assets/Primer%20Slide/Capa%200.png"
          alt=""
        />
        <img
          class="slide__layer layer-1 slide__layer--scroll"
          src="assets/Primer%20Slide/Capa%201.png"
          alt=""
        />
        <img
          class="slide__layer layer-2"
          src="assets/Primer%20Slide/Capa%202.png"
          alt=""
        />
      </section>

      <section class="slide slide--desktop poster" aria-label="Segundo slide">
        <img
          class="slide__layer layer-0"
          src="assets/Segundo%20Slide/Capa%200.png"
          alt=""
        />
        <img
          class="slide__layer layer-1"
          src="assets/Segundo%20Slide/Capa%201.png"
          alt=""
        />
        <img
          class="slide__layer layer-2"
          src="assets/Segundo%20Slide/Capa%202.png"
          alt=""
        />
        <img
          class="slide__layer layer-3"
          src="assets/Segundo%20Slide/Capa%203.png"
          alt=""
        />
        <img
          class="slide__layer layer-4"
          src="assets/Segundo%20Slide/Capa%204.png"
          alt=""
        />
        <img
          class="slide__layer layer-5"
          src="assets/Segundo%20Slide/Capa%205.png"
          alt=""
        />
      </section>

      <section class="slide slide--desktop poster" aria-label="Tercer slide">
        <img
          class="slide__layer layer-0"
          src="assets/Tercer%20Slide/Capa%200.png"
          alt=""
        />
        <img
          class="slide__layer layer-1"
          src="assets/Tercer%20Slide/Capa%201.png"
          alt=""
        />
        <img
          class="slide__layer layer-2"
          src="assets/Tercer%20Slide/Capa%202.png"
          alt=""
        />
        <img
          class="slide__layer layer-3"
          src="assets/Tercer%20Slide/Capa%203.png"
          alt=""
        />
      </section>

      <section class="slide slide--desktop poster" aria-label="Cuarto slide">
        <img
          class="slide__layer layer-0"
          src="assets/Cuarto%20Slide/FONDO.png"
          alt=""
        />
        <img
          class="slide__layer layer-1"
          src="assets/Cuarto%20Slide/TEXTO.png"
          alt=""
        />
        <a
          class="slide__button"
          href="https://vimeo.com/1148334656/88155d0382"
          target="_blank"
          rel="noopener noreferrer"
          >¡Correee!</a
        >
      </section>

      <section
        class="mobile-slide mobile-slide--cover"
        aria-label="Primer slide móvil"
      >
        <img
          class="mobile-slide__image"
          src="assets/Slides%20Movil/Capa%200.png"
          alt="Portada de Jocketa con la protagonista."
        />
      </section>

      <section class="mobile-slide" aria-label="Segundo slide móvil">
        <img
          class="mobile-slide__image"
          src="assets/Slides%20Movil/Capa%201.png"
          alt="Sinopsis y ficha técnica de Jocketa."
        />
      </section>

      <section class="mobile-slide" aria-label="Tercer slide móvil">
        <img
          class="mobile-slide__image"
          src="assets/Slides%20Movil/Capa%202.png"
          alt="Información del equipo de Jocketa."
        />
      </section>

      <section class="mobile-slide" aria-label="Cuarto slide móvil">
        <img
          class="mobile-slide__image"
          src="assets/Slides%20Movil/Capa%203.png"
          alt="Invitación a ver el documental y compartir comentarios."
        />
        <a
          class="slide__button"
          href="https://vimeo.com/1148334656/88155d0382"
          target="_blank"
          rel="noopener noreferrer"
          >¡Correee!</a
        >
      </section>
    </main>
  </body>
</html>
